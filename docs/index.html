    <title>Défi 99</title>
    <!-- Decides the theme before the first paint, from the same stored choice
         the app reads (src/storage/storage.ts: 66c:themeMode, JSON) and the
         same fallback (the phone's setting). The splash below and the app's
         first frame then share a background instead of flashing between
         two. ThemeContext picks this attribute up for its own first render. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = JSON.parse(localStorage.getItem('66c:themeMode'));
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* On iOS Safari standalone (home-screen PWA), 100% / 100vh can be
           taller or shorter than the real visible area (dynamic toolbars,
           home indicator), leaving a stale blank strip at the bottom.
           100dvh tracks the actual visible viewport in most cases, but is
           still occasionally wrong in standalone mode on iOS, so index.ts
           measures window.innerHeight in JS and sets --app-height, which
           wins if it's present. Each line here is a fallback for when the
           next one isn't supported/available yet. */
        height: 100dvh;
        height: var(--app-height, 100dvh);
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* Belt-and-suspenders against the "stale blank strip" class of bug
         (see the --app-height comment below): if the measured app height
         ever falls short of the true visible viewport on a given device,
         the gap shows this color instead of the browser's default white,
         so it blends into the app instead of standing out. Matches the
         app's own light/dark theme background (src/theme/theme.ts). */
      html,
      body,
      #root {
        background-color: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          background-color: #000000;
        }
      }
      html[data-theme='light'],
      html[data-theme='light'] body,
      html[data-theme='light'] #root {
        background-color: #ffffff;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body,
      html[data-theme='dark'] #root {
        background-color: #000000;
      }

      /* The logo, from the first paint. Until the JavaScript bundle has
         loaded and run (3 MB — on a phone, the longest part of an open) the
         screen used to be empty. This is the launch screen's mark, at the
         launch screen's size, in its colour, dead centre: React's first
         frame replaces it with the same mark at the same spot, which then
         glides up to make room for the day. Same pixels on the iOS startup
         image before this, so from the tap on the icon the logo never jumps.
         Drawn as a mask so one image serves both themes. */
      #launch-splash {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 104px;
        height: 40.21px;
        transform: translate(-50%, -50%);
        -webkit-mask: url('/sixty-six-challenge/splash/logo-v1.png') center / contain no-repeat;
        mask: url('/sixty-six-challenge/splash/logo-v1.png') center / contain no-repeat;
        background-color: #111114;
      }
      @media (prefers-color-scheme: dark) {
        #launch-splash {
          background-color: #f5f5f0;
        }
      }
      html[data-theme='light'] #launch-splash {
        background-color: #111114;
      }
      html[data-theme='dark'] #launch-splash {
        background-color: #f5f5f0;
      }
      /* Belt-and-suspenders against a single oversized element (e.g. a
         Text that renders wider than its container) making the whole page
         horizontally pannable on iOS Safari — body's own overflow:hidden
         doesn't always stop that. This only clips, no position changes,
         so it doesn't touch the touch-input bug from an earlier attempt
         at this file (position:fixed is what broke that, not this). */
      html {
        overflow-x: hidden;
      }
      html,
      body,
      #root {
        max-width: 100vw;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* react-native-web makes every Pressable focusable (tabIndex="0" on
         its div), which gets the browser's native focus ring — invisible
         on our light theme, but a big pale halo around whatever was last
         tapped once the background goes dark (e.g. the active tab bar
         item in dark mode). It doesn't carry role="button" unless a
         screen expicitly passes accessibilityRole, so target every
         element instead of just [role="button"] — this is a touch-first
         app, not a keyboard-nav one, so it's safe to drop everywhere. */
      #root *:focus,
      #root *:focus-visible {
        outline: none !important;
        box-shadow: none !important;
      }
      #root * {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
