<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <!-- Belt-and-suspenders against iOS Safari standalone serving a stale
         cached copy of this page after a new deploy (index.ts also runs a
         JS-level check-and-reload against the bundle hash). -->
    <meta httpEquiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta httpEquiv="Pragma" content="no-cache" />
    <meta httpEquiv="Expires" content="0" />
    <title>Défi 99</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* On iOS Safari standalone (home-screen PWA), 100% / 100vh can be
           taller or shorter than the real visible area (dynamic toolbars,
           home indicator), leaving a stale blank strip at the bottom.
           100dvh tracks the actual visible viewport in most cases, but is
           still occasionally wrong in standalone mode on iOS, so index.ts
           measures window.innerHeight in JS and sets --app-height, which
           wins if it's present. Each line here is a fallback for when the
           next one isn't supported/available yet. */
        height: 100dvh;
        height: var(--app-height, 100dvh);
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* Belt-and-suspenders against the "stale blank strip" class of bug
         (see the --app-height comment below): if the measured app height
         ever falls short of the true visible viewport on a given device,
         the gap shows this color instead of the browser's default white,
         so it blends into the app instead of standing out. Matches the
         app's own light/dark theme background (src/theme/theme.ts). */
      html,
      body,
      #root {
        background-color: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          background-color: #0b0b0d;
        }
      }
      /* Belt-and-suspenders against a single oversized element (e.g. a
         Text that renders wider than its container) making the whole page
         horizontally pannable on iOS Safari — body's own overflow:hidden
         doesn't always stop that. This only clips, no position changes,
         so it doesn't touch the touch-input bug from an earlier attempt
         at this file (position:fixed is what broke that, not this). */
      html {
        overflow-x: hidden;
      }
      html,
      body,
      #root {
        max-width: 100vw;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  <link rel="icon" href="/sixty-six-challenge/favicon.ico"/></head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  <script src="/sixty-six-challenge/_expo/static/js/web/index-7edfc7a9752cec9e691e56b6e8fcafaa.js" defer></script>
</body>
</html>
